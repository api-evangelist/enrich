name: enrich
description: Enrich is a private, invite-only membership network for senior technology leaders — VPs,
  Directors, and CXOs from companies including Google, Slack, Anthropic, and OpenAI. It runs peer-led
  conversations with executive coaching, curated small-group and monthly in-person dinners, expert-led
  operator discussions, topic-based peer groups (organizational design, career transitions), and a private
  Slack community for real-time peer advice. Backed by Bloomberg Beta and Cowboy Ventures, and added to the
  API Evangelist network as a VC-portfolio lead. Enrich publishes no public developer API, SDK, or API
  documentation surface — it is a community/membership product, not an API provider.
